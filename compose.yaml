name: materialhub

x-php: &php
  image: materialhub-php:dev
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    - type: bind
      source: ./.env.docker
      target: /var/www/html/.env
      bind:
        create_host_path: false
    - vendor:/var/www/html/vendor
    - storage:/var/www/html/storage
    - bootstrap-cache:/var/www/html/bootstrap/cache

services:
  init:
    <<: *php
    user: root
    command: ["materialhub-init"]
    restart: "no"

  app:
    <<: *php
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_started

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.docker
    # Reuse Laravel's DB settings without reading the native .env.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export POSTGRES_DB="$$DB_DATABASE"
        export POSTGRES_USER="$$DB_USERNAME"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$DB_USERNAME\" -d \"$$DB_DATABASE\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  queue:
    <<: *php
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=60"]
    stop_grace_period: 70s
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  vendor:
  storage:
  bootstrap-cache:
